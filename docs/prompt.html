<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브이앤엠제이 AI 노출 감사 — 질문 상세</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    color-scheme: light;
    --paper: #f5f3ee; --surface: #fcfcfb; --surface-2: #efece3;
    --ink: #17160f; --ink-2: #55534a; --ink-muted: #898781;
    --line: #ddd8cb; --line-strong: #c3beac;
    --accent: #1f5d4f; --accent-soft: #dbe9e2; --accent-ink: #0f342b;
    --good: #0ca30c; --warning: #b3790a; --serious: #ec835a; --critical: #d03b3b; --unknown: #6b6a63;
    --good-bg: #e3f4e0; --warning-bg: #fdedd0; --serious-bg: #fbe3d8; --critical-bg: #f9dcdb; --unknown-bg: #e6e4dc;
    --gpt: #0f8a6b; --gemini: #3457d5; --claude: #b8613f;
    --grid: #e1e0d9; --up: #0c7a2f; --down: #b3341f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #0d0d0c; --surface: #1a1a19; --surface-2: #222220;
      --ink: #f5f4ef; --ink-2: #c3c2b7; --ink-muted: #8f8d85;
      --line: #2c2c2a; --line-strong: #3d3d39;
      --accent: #5bbfa4; --accent-soft: #1b3a32; --accent-ink: #cdeee2;
      --good: #37c937; --warning: #fab219; --serious: #ec835a; --critical: #e66767; --unknown: #a3a19a;
      --good-bg: #163a1c; --warning-bg: #3d2f0f; --serious-bg: #3d241a; --critical-bg: #3d1c1c; --unknown-bg: #2a2a27;
      --gpt: #17a883; --gemini: #5f7dff; --claude: #c96a44;
      --grid: #2c2c2a; --up: #37c937; --down: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0d0d0c; --surface: #1a1a19; --surface-2: #222220;
    --ink: #f5f4ef; --ink-2: #c3c2b7; --ink-muted: #8f8d85;
    --line: #2c2c2a; --line-strong: #3d3d39;
    --accent: #5bbfa4; --accent-soft: #1b3a32; --accent-ink: #cdeee2;
    --good: #37c937; --warning: #fab219; --serious: #ec835a; --critical: #e66767; --unknown: #a3a19a;
    --good-bg: #163a1c; --warning-bg: #3d2f0f; --serious-bg: #3d241a; --critical-bg: #3d1c1c; --unknown-bg: #2a2a27;
    --gpt: #17a883; --gemini: #5f7dff; --claude: #c96a44;
    --grid: #2c2c2a; --up: #37c937; --down: #e66767;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans KR", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  h1, h2 { text-wrap: balance; font-weight: 700; margin: 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px 96px; }

  .back { font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; margin: 28px 0 16px; }
  .masthead { border-bottom: 1px solid var(--line); padding-bottom: 22px; margin-bottom: 26px; }
  .masthead h1 { font-size: 22px; }
  .masthead .cap { font-size: 12.5px; color: var(--ink-muted); margin-top: 6px; }

  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 700px) { .stat-row { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; }
  .card h2 { font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .stat-num { font-family: "IBM Plex Mono", monospace; font-size: 30px; font-weight: 600; margin-top: 6px; }
  .model-chips { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .model-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); }
  .model-chip i { width: 8px; height: 8px; border-radius: 50%; }

  .chart-card { margin-bottom: 20px; }
  .chart-card .head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
  .toggle-group { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .toggle-group button { font-family: "IBM Plex Sans KR", sans-serif; font-size: 12.5px; padding: 6px 14px; border: none; background: var(--surface); color: var(--ink-2); cursor: pointer; border-right: 1px solid var(--line); }
  .toggle-group button:last-child { border-right: none; }
  .toggle-group button.active { background: var(--accent); color: #fff; font-weight: 600; }
  .trend-svg { display: block; overflow: visible; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-label { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--ink-muted); }
  .trend-dot { cursor: pointer; }
  .trend-tooltip { position: absolute; background: var(--ink); color: var(--paper); font-size: 11.5px; padding: 6px 10px; border-radius: 6px; pointer-events: none; white-space: nowrap; z-index: 5; line-height: 1.4; }
  .chart-wrap { position: relative; margin-top: 8px; }
  .chart-legend { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  .chart-legend span { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .lane-heading { display: flex; align-items: baseline; gap: 10px; margin: 36px 0 14px; }
  .lane-heading h2 { font-size: 16.5px; }
  .lane-heading .n { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-muted); }

  .rank-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .rank-list li { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; font-size: 13px; }
  .rank-list li.us { background: var(--accent-soft); font-weight: 600; }
  .rank-n { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-muted); width: 16px; flex-shrink: 0; }
  .rank-name { flex: 1; }
  .rank-pct { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--ink-2); }
  .rank-empty, .table-empty { font-size: 12.5px; color: var(--ink-muted); padding: 16px; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13px; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-muted); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line-strong); background: var(--surface-2); }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.warning { background: var(--warning-bg); color: var(--warning); }
  .pill.serious { background: var(--serious-bg); color: var(--serious); }
  .pill.critical { background: var(--critical-bg); color: var(--critical); }
  .pill.unknown { background: var(--unknown-bg); color: var(--unknown); }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .platform-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .platform-tag i { width: 8px; height: 8px; border-radius: 50%; }
  .reasoning { font-size: 12px; color: var(--ink-muted); margin-top: 3px; max-width: 46ch; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">‹ 전체 보기로 돌아가기</a>
  <div class="masthead">
    <h1 id="qTitle">질문을 불러오는 중…</h1>
    <div class="cap" id="qCap"></div>
  </div>

  <div id="app"></div>

  <div class="lane-heading" style="margin-top:40px"><h2>인용 출처</h2><span class="n">이 질문에 대한 답변에서 인용된 도메인</span></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Domain</th><th>모델</th><th style="text-align:right">인용 횟수</th></tr></thead>
    <tbody id="citationBody"></tbody>
  </table></div>

  <div class="lane-heading"><h2>실행 기록</h2><span class="n" id="runCount"></span></div>
  <div class="table-wrap"><table>
    <thead><tr><th>실행 일자</th><th>AI 모델</th><th>브랜드 언급</th><th>근거</th></tr></thead>
    <tbody id="runBody"></tbody>
  </table></div>
</div>

<script src="./lib.js"></script>
<script>
const qIdx = Math.max(0, parseInt(new URLSearchParams(location.search).get("q") || "0", 10));

function statusOf(row) {
  if (!row || row.error || row.exposed === null || row.exposed === undefined) return { cls: "unknown", label: "확인 오류" };
  if (!row.exposed) return { cls: "critical", label: "미언급" };
  if (row.rank === 1) return { cls: "good", label: "TOP1 언급" };
  if (row.rank && row.rank <= 3) return { cls: "warning", label: "TOP" + row.rank + " 언급" };
  return { cls: "serious", label: "언급 · 순위불가" };
}

let CHART_MODE = "total";
let HIST = [];

function renderEmpty() {
  document.getElementById("qTitle").textContent = "아직 측정 데이터가 없습니다";
  document.getElementById("app").innerHTML = `<div class="rank-empty">GitHub Actions의 Daily GEO check가 처음 실행되면 이 페이지에 데이터가 채워집니다.</div>`;
}

fetch("./data/results.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((data) => {
    HIST = data.history || [];
    if (!HIST.length) return renderEmpty();
    const latest = HIST[HIST.length - 1];
    const question = latest.questions[qIdx];
    if (!question) return renderEmpty();

    document.getElementById("qTitle").textContent = question;
    document.getElementById("qCap").textContent = `최근 ${HIST.length}일 기준`;

    renderStats(latest, question);
    renderChart();
    renderRanking();
    renderCitations();
    renderRuns();
  })
  .catch(renderEmpty);

function runsForQuestion(hist, platforms = PLATFORMS) {
  return flattenRuns(hist, { days: 0, platforms, questionIndices: [qIdx] });
}

function renderStats(latest, question) {
  const runs = runsForQuestion(HIST);
  const app = document.getElementById("app");

  const statRow = document.createElement("div");
  statRow.className = "stat-row";
  statRow.innerHTML = `
    <div class="card">
      <h2>프롬프트 실행 횟수</h2>
      <div class="stat-num mono">${runs.length}</div>
    </div>
    <div class="card">
      <h2>분석한 AI 모델</h2>
      <div class="model-chips">
        ${PLATFORMS.map((p) => `<span class="model-chip"><i style="background:${PLATFORM_META[p].color}"></i>${PLATFORM_META[p].name}</span>`).join("")}
      </div>
    </div>
  `;
  app.appendChild(statRow);

  const chartCard = document.createElement("div");
  chartCard.className = "card chart-card";
  chartCard.innerHTML = `
    <div class="head">
      <div>
        <h2 style="font-size:14.5px">노출 점유율 추이</h2>
        <div class="cap" style="font-size:12px;color:var(--ink-muted);margin-top:3px">이 질문에서 우리 병원이 언급된 비율</div>
      </div>
      <div class="toggle-group" id="chartToggle">
        <button data-mode="total" class="active">전체</button>
        <button data-mode="engine">엔진별</button>
      </div>
    </div>
    <div class="chart-wrap" id="chartWrap"></div>
    <div class="chart-legend" id="chartLegend"></div>
  `;
  app.appendChild(chartCard);
  document.getElementById("chartToggle").querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      CHART_MODE = btn.dataset.mode;
      document.querySelectorAll("#chartToggle button").forEach((b) => b.classList.toggle("active", b === btn));
      renderChart();
    });
  });

  const rankHeading = document.createElement("div");
  rankHeading.className = "lane-heading";
  rankHeading.innerHTML = `<h2>브랜드 랭킹</h2><span class="n">이 질문에서 함께 언급된 병원 순위</span>`;
  app.appendChild(rankHeading);
  const rankCard = document.createElement("div");
  rankCard.className = "card";
  rankCard.innerHTML = `<ul class="rank-list" id="rankList"></ul>`;
  app.appendChild(rankCard);
}

function renderChart() {
  const wrap = document.getElementById("chartWrap");
  const legend = document.getElementById("chartLegend");
  if (CHART_MODE === "total") {
    const points = dailyTrend(HIST, { questionIndices: [qIdx] }).map((d) => ({ x: d.date, y: d.pct }));
    renderTrendChart(wrap, [{ label: "전체", color: "var(--accent)", points }], { yMax: 100, ySuffix: "%" });
    legend.innerHTML = `<span><i style="background:var(--accent)"></i>전체 노출 점유율</span>`;
  } else {
    const series = PLATFORMS.map((p) => ({
      label: PLATFORM_META[p].name,
      color: PLATFORM_META[p].color,
      points: dailyTrend(HIST, { platform: p, questionIndices: [qIdx] }).map((d) => ({ x: d.date, y: d.pct })),
    }));
    renderTrendChart(wrap, series, { yMax: 100, ySuffix: "%" });
    legend.innerHTML = PLATFORMS.map((p) => `<span><i style="background:${PLATFORM_META[p].color}"></i>${PLATFORM_META[p].name}</span>`).join("");
  }
}

function renderRanking() {
  const runs = runsForQuestion(HIST);
  const { list } = brandRanking(runs, { limit: 8 });
  const ul = document.getElementById("rankList");
  if (!list.length) { ul.innerHTML = `<div class="rank-empty">집계할 브랜드 데이터가 없습니다.</div>`; return; }
  ul.innerHTML = list.map((b, i) => `
    <li class="${b.isUs ? "us" : ""}">
      <span class="rank-n">${i + 1}</span>
      <span class="rank-name">${b.name}${b.isUs ? " (우리)" : ""}</span>
      <span class="rank-pct mono">${b.pct}%</span>
    </li>
  `).join("");
}

function renderCitations() {
  const runs = runsForQuestion(HIST);
  const counts = new Map();
  for (const r of runs) {
    if (r.error) continue;
    for (const c of r.citations || []) {
      if (!c?.domain) continue;
      const key = c.domain;
      const cur = counts.get(key) || { domain: key, count: 0, platforms: new Set() };
      cur.count += 1;
      cur.platforms.add(r.platform);
      counts.set(key, cur);
    }
  }
  const tbody = document.getElementById("citationBody");
  const list = [...counts.values()].sort((a, b) => b.count - a.count);
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="3" class="table-empty">아직 인용 출처 데이터가 없습니다. 자동 파이프라인이 실행되면 이 답변들이 참고한 도메인이 여기 표시됩니다.</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map((c) => `
    <tr>
      <td>${c.domain}</td>
      <td>${[...c.platforms].map((p) => `<span class="platform-tag"><i style="background:${PLATFORM_META[p].color}"></i>${PLATFORM_META[p].name}</span>`).join(" ")}</td>
      <td style="text-align:right" class="mono">${c.count}</td>
    </tr>
  `).join("");
}

function renderRuns() {
  const runs = runsForQuestion(HIST).slice().reverse();
  document.getElementById("runCount").textContent = `${runs.length}건`;
  const tbody = document.getElementById("runBody");
  if (!runs.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="table-empty">실행 기록이 없습니다.</td></tr>`;
    return;
  }
  tbody.innerHTML = runs.map((r) => {
    const st = statusOf(r);
    return `
      <tr>
        <td class="mono">${r.date}</td>
        <td><span class="platform-tag"><i style="background:${PLATFORM_META[r.platform].color}"></i>${PLATFORM_META[r.platform].name}</span></td>
        <td><span class="pill ${st.cls}"><i></i>${st.label}</span></td>
        <td><div class="reasoning">${r.reasoning || ""}</div></td>
      </tr>
    `;
  }).join("");
}
</script>
</body>
</html>
